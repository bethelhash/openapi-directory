openapi: "3.0.0"
info:
  title: Rooftop Solar Suitability API
  version: "2.0.0"
  description: |
    POST a latitude and longitude — the API detects the building via
    OpenStreetMap, measures the roof polygon, runs the NREL physics engine,
    and returns a full solar suitability analysis. No address input needed.
    Free plan returns full analysis. Pro plan adds NPV, IRR, LCOE, demand
    savings, BESS sizing, and batch processing for up to 20 sites per call.
  contact:
    name: Tinashe Nedi
    email: support@solartruth.app
    url: https://rapidapi.com/user/bethelnedi
  x-apisguru-categories:
    - energy
  x-logo:
    url: https://solartruth.app/logo.png
externalDocs:
  url: https://amfumu-rooftop-solar-api.hf.space/docs
servers:
  - url: https://amfumu-rooftop-solar-api.hf.space
paths:
  /health:
    get:
      summary: API status and methodology register
      operationId: getHealth
      responses:
        "200":
          description: API status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"
                  version:
                    type: string
  /pricing:
    get:
      summary: Plan details and rate limits
      operationId: getPricing
      responses:
        "200":
          description: Pricing plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
  /ping:
    get:
      summary: Internal keepalive
      operationId: getPing
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /rooftop/quick:
    post:
      summary: Quick rooftop analysis — Free plan
      operationId: rooftopQuick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  example: 37.7749
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  example: -122.4194
      responses:
        "200":
          description: Full rooftop solar suitability analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: string
                  roof_area_m2:
                    type: number
                  system_capacity_kw:
                    type: number
                  annual_production_kwh:
                    type: number
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rooftop/full:
    post:
      summary: Full rooftop analysis with financials — Pro plan
      operationId: rooftopFull
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  example: 37.7749
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  example: -122.4194
                annual_kwh_consumption:
                  type: number
                flat_rate_usd_kwh:
                  type: number
                roof_pct:
                  type: number
      responses:
        "200":
          description: Full analysis with NPV, IRR, LCOE, BESS
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: string
                  npv_usd:
                    type: number
                  irr_pct:
                    type: number
                  lcoe_usd_kwh:
                    type: number
        "403":
          description: Pro plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rooftop/batch:
    post:
      summary: Batch analysis up to 20 sites — Pro plan
      operationId: rooftopBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sites
              properties:
                sites:
                  type: array
                  maxItems: 20
                  minItems: 1
                  items:
                    type: object
                    required:
                      - latitude
                      - longitude
                    properties:
                      latitude:
                        type: number
                        format: double
                        minimum: -90
                        maximum: 90
                      longitude:
                        type: number
                        format: double
                        minimum: -180
                        maximum: 180
      responses:
        "200":
          description: Batch results array
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        "403":
          description: Pro plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reference/building-types:
    get:
      summary: Building types with usable roof fractions
      operationId: getReferenceBuildingtypes
      responses:
        "200":
          description: Building type reference data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /reference/climate-zones:
    get:
      summary: Climate zones with specific yield
      operationId: getReferenceClimatezones
      responses:
        "200":
          description: Climate zone and yield data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /reference/methodology:
    get:
      summary: Full methodology and citations
      operationId: getReferenceMethodology
      responses:
        "200":
          description: All data sources and citations
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
